[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strata-scan"
version = "0.1.0"        # the single source of truth: `stratascan.__version__` reads it back with importlib.metadata
description = "Turn scanned books into clean pages, text and pictures (FastAPI, CLI, strata-react)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "strata-python",     # shared server code: oslib, settings, web serving, CLI commands, test plugin, strata-check
    "tzdata; sys_platform == 'win32'",   # IANA timezone database, needed on Windows for zoneinfo
    "opencv-python-headless>=5.0.0.93",
    "numpy>=2.4.6",
    "pypdfium2>=5.15.2",
    "pypdf>=7.1.0",
    "pillow>=13.0.0",
    "omarchy-db",
    "strata-models-client",
    "python-multipart>=0.0.33",
]

[tool.uv.sources]
# Tracks main (no tag): uv.lock pins the commit, `uv lock --upgrade-package strata-python` moves it (the weekly workflow does that)
strata-python = { git = "https://github.com/jburnhams/strata-python" }
omarchy-db = { git = "https://github.com/jburnhams/database", subdirectory = "python" }
strata-models-client = { git = "https://github.com/jburnhams/strata-models", subdirectory = "client" }

[project.scripts]
strata-scan = "stratascan.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis",
    "pytest-randomly",
    "pytest-timeout",
    "pytest-xdist",
    "diff-cover",
    "ruff",
    "pyright",
    "ty",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stratascan"]
# The React build is gitignored but must ship in the wheel: `cd web && npm run build` before `uv build`.
artifacts = ["src/stratascan/server/static/**"]

[tool.pytest.ini_options]
pythonpath = ["tests/utils"]
strata_env_prefix = "STRATASCAN"                 # strata-python plugin: STRATASCAN_HOME and STRATASCAN_DATA point into a tmp dir for every test
strata_tuning_vars = ["STRATASCAN_MAX_DPI", "STRATASCAN_WORKERS", "STRATA_MODELS_URL"]  # removed from the environment for every test
testpaths = ["tests/unit"]
addopts = "-ra --timeout=300 --strict-markers --strict-config"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]       # TestClient noise from the installed starlette; remove when the dependency moves on
markers = [
    "integration: runs the CLI and HTTP server end-to-end (tests/integration)",
    "slow: slow tests; run manually or on a schedule",
]

[tool.coverage.run]
source = ["src/stratascan"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
skip_empty = true
show_missing = false
# Measured from the unit suite only (tests/unit). Ratchet this up as coverage improves.
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "S", "TID"]
ignore = ["E501"]        # the formatter wraps code; long comments and docstrings stay (the house style comments the why)

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"pytest.importorskip".msg = "Do not skip when a dependency is missing: install it (locally and in CI) and let the test fail if it is not there. A deliberate skip is a marker with a reason, see AGENTS.md (Testing)."

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S603", "S607"]    # asserts, fake secrets, tmp paths, subprocess of our own CLI

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.omarchy-db]
app = "stratascan"                  # role and schema in the shared database (`dbtool new-app stratascan` once on the server)
models = "stratascan.db.models:Base"
migrations = "migrations"           # Alembic revisions, committed; run at service start (store.engine)
