<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>strata-scan</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--line:#d8d8dc}
@media(prefers-color-scheme:dark){:root{--bg:#161618;--fg:#ececee;--mut:#9a9aa2;--line:#33333a}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:32px 16px}h1{font-size:22px;margin:0 0 4px}.mut{color:var(--mut)}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0}
</style></head><body><main>
<!-- Served only when the web app has not been built (cd web && npm run build): the books and their state, read-only. -->
<h1>strata-scan</h1><p class="mut">The web app is not built; this page only lists the books. Use the CLI (<code>strata-scan --help</code>) or build the web app.</p>
<div id="list"></div>
</main><script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('api/books').then(r=>r.json()).then(bs=>{document.getElementById('list').innerHTML=bs.length?bs.map(b=>`<div class="card"><b>${esc(b.title)}</b> <span class="mut">${esc(b.pages)} pages, ${esc(b.stage||'idle')}</span></div>`).join(''):'<p class="mut">No books yet: strata-scan add &lt;pdf or folder&gt;</p>'});
</script></body></html>
