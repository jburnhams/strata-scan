name: Integration tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install Tesseract (the tests read pages with the real command)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr ;;
            macOS) brew install tesseract ;;
            # The Chocolatey feed has refused the package (2026-11-25: 503s and 504s, "installed 0/0 packages", exit 0), so fall back to
            # conda-forge's build through micromamba (one static binary from GitHub), and check the command runs either way.
            Windows)
              choco install tesseract -y --no-progress || true
              if [ -x "/c/Program Files/Tesseract-OCR/tesseract.exe" ]; then
                echo "C:\Program Files\Tesseract-OCR" >> "$GITHUB_PATH"
              else
                curl -fsSL --retry 4 -o "$RUNNER_TEMP/micromamba.exe" https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-win-64
                "$RUNNER_TEMP/micromamba.exe" create -y -q -r "$RUNNER_TEMP/mamba" -p "$RUNNER_TEMP/tess" -c conda-forge tesseract
                cygpath -w "$RUNNER_TEMP/tess/Library/bin" >> "$GITHUB_PATH"
                echo "TESSDATA_PREFIX=$(cygpath -w "$RUNNER_TEMP/tess/Library/share/tessdata")" >> "$GITHUB_ENV"  # not next to the binary, where Tesseract looks without conda activation
                # conda-forge's package has no languages (0 listed), so add English and the tsv and pdf outputs as apt's tesseract-ocr has them
                td="$RUNNER_TEMP/tess/Library/share/tessdata"; mkdir -p "$td/configs"
                curl -fsSL --retry 4 -o "$td/eng.traineddata" https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
                for f in configs/tsv configs/pdf pdf.ttf; do [ -f "$td/$f" ] || curl -fsSL --retry 4 -o "$td/$f" "https://github.com/tesseract-ocr/tesseract/raw/main/tessdata/$f"; done
              fi ;;
          esac
      - name: Tesseract is installed
        shell: bash
        run: |
          tesseract --version | head -1
          langs=$(tesseract --list-langs 2>&1 | tr -d '\r')  # Windows prints CRLF
          echo "$langs"
          grep -qx eng <<<"$langs"
      - run: uv sync --locked
      - name: Integration tests (CLI and HTTP API end-to-end)
        run: uv run pytest tests/integration -n auto --durations=10

  audit:
    name: Dependency audit (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv audit --locked

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:integration
