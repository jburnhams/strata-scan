name: Integration tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install Tesseract (the tests read pages with the real command)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr ;;
            macOS) brew install tesseract ;;
            # The Chocolatey feed has refused the package (2026-11-25: "installed 0/0 packages", exit 0), so fall back to UB Mannheim's
            # installer (the build Tesseract's own docs point Windows users to), and check the command runs either way.
            Windows)
              choco install tesseract -y --no-progress || true
              if [ ! -x "/c/Program Files/Tesseract-OCR/tesseract.exe" ]; then
                curl -fsSL --retry 4 -o "$RUNNER_TEMP/tesseract-setup.exe" https://digi.bib.uni-mannheim.de/tesseract/tesseract-ocr-w64-setup-5.5.0.20241111.exe
                "$RUNNER_TEMP/tesseract-setup.exe" //S
              fi
              echo "C:\Program Files\Tesseract-OCR" >> "$GITHUB_PATH" ;;
          esac
      - name: Tesseract is installed
        shell: bash
        run: tesseract --version | head -1
      - run: uv sync --locked
      - name: Integration tests (CLI and HTTP API end-to-end)
        run: uv run pytest tests/integration -n auto --durations=10

  audit:
    name: Dependency audit (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv audit --locked

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:integration
