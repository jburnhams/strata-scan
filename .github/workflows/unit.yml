name: Unit tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - name: Lockfile, lint, format and types (once, on the newest Python)
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: uv run --locked strata-check --fast
      - name: Unit tests with coverage (unit suite only)
        run: uv run pytest tests/unit --cov --cov-report=term --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage
          path: coverage.xml

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests with coverage (unit project only)
        run: npm run test:coverage
      - name: Coverage gate (unit + jsdom component tests together, floors in web/coverage-floor.json)
        run: npm run test:coverage:gate -- --coverage.reporter=text --coverage.reporter=json-summary
      - name: Build
        run: npm run build
      - name: Build Storybook
        run: npm run build-storybook

  visual:
    name: Visual regression (Storybook and the app's routes in Chromium, light and dark)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The Chromium pinned by package.json's exact playwright version: the one the baselines were written in.
      - run: npx playwright install --with-deps chromium
      # strata-visual (from strata-react) screenshots every story and every route state in strata-visual.config.ts
      # and compares them with tests/visual/baselines/ (pixelmatch).
      - run: npm run test:visual
      - name: Upload screenshots that differ
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs
          path: web/tests/visual/output/
          if-no-files-found: ignore
